name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Require tag and manifest versions to match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run version:check -- "$RELEASE_TAG"

      - name: Test version tooling
        run: npm run test:version

  package:
    # Releases ship one Windows installer (plus latest.json for in-app updates).
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the installer and attach it to a draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the in-app update bundle; latest.json is uploaded alongside it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Vide v__VERSION__
          # e.g. Vide_1.0.1_x64-setup.exe (the installed app keeps its original internal name)
          releaseAssetNamePattern: Vide_[version]_[arch][setup][ext]
          releaseBody: |
            Download **`Vide_…_x64-setup.exe`** below and run it. Installed copies update themselves.

            The installer is not code-signed yet, so Windows SmartScreen may say "Windows protected your PC". Click **More info → Run anyway**.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # signatures are embedded in latest.json; the separate .sig files are unused
          uploadUpdaterSignatures: false
